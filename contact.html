<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | BPEC Support</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/8/80/Esports_icon.svg" />
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #0a0a0a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .contact-container {
      background: #151515;
      padding: 30px 40px;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
    }

    h1 {
      text-align: center;
      color: #00bfff;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, textarea {
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #222;
      color: white;
      font-size: 14px;
      resize: none;
    }

    textarea {
      height: 100px;
    }

    button {
      background: #00bfff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s ease-in-out;
    }

    button:hover {
      background: #008fcc;
    }

    .success, .error {
      text-align: center;
      margin-top: 10px;
      font-weight: 500;
    }

    .success {
      color: #00ff88;
    }

    .error {
      color: #ff4444;
    }

    .g-recaptcha {
      margin: 10px 0;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="contact-container">
    <h1>Contact Support</h1>
    <form id="contactForm">
      <input type="text" id="name" name="name" placeholder="Your Name" required />
      <input type="email" id="email" name="email" placeholder="Your Email" required />
      <textarea id="message" name="message" placeholder="Your Message" required></textarea>
      <div class="g-recaptcha" data-sitekey="6Ld5FiMrAAAAAFl68Zd2L-8nO2Nrj_seB1u7cw6J"></div>
      <button type="submit">Send Message</button>
      <div id="responseMsg"></div>
    </form>
  </div>

  <!-- reCAPTCHA -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>
    // === CONFIG ===
    const RECAPTCHA_SITE_KEY = '6Ld5FiMrAAAAAFl68Zd2L-8nO2Nrj_seB1u7cw6J';
    const EMAILJS_SERVICE_ID = 'BEC_Web_support';
    const EMAILJS_TEMPLATE_ID = 'template_poeh22h';
    const EMAILJS_PUBLIC_KEY = 'lAUSVxP_kePVrqdge';

    (function() {
      emailjs.init(EMAILJS_PUBLIC_KEY);
    })();

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const responseMsg = document.getElementById('responseMsg');
      responseMsg.textContent = '';
      const recaptchaResponse = grecaptcha.getResponse();

      if (!recaptchaResponse) {
        responseMsg.textContent = '⚠️ Please verify you are human.';
        responseMsg.className = 'error';
        return;
      }

      const params = {
        from_name: document.getElementById('name').value,
        from_email: document.getElementById('email').value,
        message: document.getElementById('message').value,
      };

      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params);
        responseMsg.textContent = '✅ Message sent successfully!';
        responseMsg.className = 'success';
        document.getElementById('contactForm').reset();
        grecaptcha.reset();
      } catch (error) {
        console.error('EmailJS Error:', error);
        responseMsg.textContent = '❌ Failed to send message. Try again later.';
        responseMsg.className = 'error';
      }
    });
  </script>
</body>
</html>

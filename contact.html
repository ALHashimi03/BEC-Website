<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | Bahrain Esports Community</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" href="Images/Logo_white_gradient.png" type="image/png"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <header></header><!-- nav injected by components.js -->

  <main style="padding-top: clamp(80px, 12vw, 120px);">
    <section id="contact" class="section contact">
      <div class="section-title-container">
        <h2 class="section-title">Contact Us</h2>
      </div>

      <div class="contact-form-container">
        <div class="contact-form">
          <form id="contactForm">
            <div class="form-group">
              <label for="name">Your Name</label>
              <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name" required/>
            </div>
            <div class="form-group">
              <label for="email">Your Email</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required/>
            </div>
            <div class="form-group">
              <label for="message">Your Message</label>
              <textarea id="message" name="message" class="form-control" placeholder="Enter your message" rows="4" required></textarea>
            </div>
            <div class="form-group">
              <div class="g-recaptcha" data-sitekey="6LclewEsAAAAAGRSm5KeXzJzUc8ElrW5-nIyhfF1"></div>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Send Message</button>
            <div id="responseMsg" style="margin-top: 10px; text-align: center;"></div>
          </form>
        </div>
      </div>

      <div style="text-align: center; margin-top: 2rem;">
        <p>Or email us directly at: <a href="mailto:bahrainesportscommunity@gmail.com">bahrainesportscommunity@gmail.com</a></p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div><!-- footer injected by components.js -->

  <!-- EmailJS + reCAPTCHA (contact page only) -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <script>
    // EmailJS config
    var EMAILJS_SERVICE_ID  = 'BEC_Web_support';
    var EMAILJS_TEMPLATE_ID = 'template_o1uw69m';
    var EMAILJS_PUBLIC_KEY  = 'lAUSVxP_kePVrqdge';
    emailjs.init(EMAILJS_PUBLIC_KEY);

    document.getElementById('contactForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var responseMsg = document.getElementById('responseMsg');
      responseMsg.textContent = '';

      // Verify reCAPTCHA
      var recaptchaResponse;
      try { recaptchaResponse = grecaptcha.getResponse(); } catch (err) { recaptchaResponse = ''; }
      if (!recaptchaResponse) {
        responseMsg.textContent = '⚠️ Please verify that you are not a robot.';
        responseMsg.style.color = '#ff4444';
        return;
      }

      var submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          from_name:  document.getElementById('name').value,
          from_email: document.getElementById('email').value,
          message:    document.getElementById('message').value,
        });
        responseMsg.textContent = '✅ Message sent successfully!';
        responseMsg.style.color = '#00cc66';
        document.getElementById('contactForm').reset();
        grecaptcha.reset();
      } catch (error) {
        console.error(error);
        responseMsg.textContent = '❌ Failed to send message. Please try again later.';
        responseMsg.style.color = '#ff4444';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Message';
      }
    });
  </script>

  <script src="components.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>

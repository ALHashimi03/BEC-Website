<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Events | Bahrain Esports Community</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" href="Images/Logo_white_gradient.png" type="image/png"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <header></header><!-- nav injected by components.js -->

  <main style="padding-top: clamp(80px, 12vw, 120px);">
    <section id="events" class="section events-section">
      <div class="section-title-container">
        <h2 class="section-title">Events</h2>
      </div>

      <div class="events-controls">
        <input type="text" id="event-search" placeholder="Search events…" aria-label="Search events"/>
        <div class="event-filters">
          <button class="filter-btn active" data-filter="all">All Events</button>
          <button class="filter-btn" data-filter="tournament">Tournaments</button>
          <button class="filter-btn" data-filter="community">Community Events</button>
          <button class="filter-btn" data-filter="workshop">Workshops</button>
        </div>
      </div>

      <div id="events-grid" class="events-grid"></div>
    </section>

    <!-- Image Lightbox -->
    <div id="img-lightbox" class="img-lightbox" style="display:none;" role="dialog" aria-modal="true" aria-label="Image viewer">
      <span class="img-lightbox-arrow img-lightbox-arrow-left"  id="img-lightbox-arrow-left"  aria-label="Previous image">&#10094;</span>
      <img  class="img-lightbox-content" id="img-lightbox-content" src="" alt="Expanded event image">
      <span class="img-lightbox-arrow img-lightbox-arrow-right" id="img-lightbox-arrow-right" aria-label="Next image">&#10095;</span>
      <span class="img-lightbox-close"   id="img-lightbox-close"   aria-label="Close">&times;</span>
    </div>
  </main>

  <div id="site-footer"></div><!-- footer injected by components.js -->

  <script src="components.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>

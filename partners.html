<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Partners &amp; Collaborators | Bahrain Esports Community</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" href="Images/Logo_white_gradient.png" type="image/png"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <header></header><!-- nav injected by components.js -->

  <main style="padding-top: clamp(80px, 12vw, 120px);">
    <section id="clients" class="section">
      <div class="section-title-container">
        <h2 class="section-title">Our Partners & Collaborators</h2>
      </div>
      
      <!-- Partners Section -->  <!-- 
      <div class="partners-section">
        <div class="subsection-title-container">
          <h3 class="subsection-title">Partners</h3>
        </div>
        <div class="partners-container">
          <div class="logo-grid">
            <a href="https://www.instagram.com/darkness.bh/" target="_blank" rel="noopener noreferrer" class="logo-item">
              <img src="Images/logos/DarknessLogo.png" alt="Darkness Gaming Logo" class="partner-logo">
            </a>
          </div>
        </div>
      </div>

      <!-- Collaborators Section -->
      <div class="collaborators-section">
        <div class="subsection-title-container">
          <h3 class="subsection-title">Collaborators</h3>
        </div>
        <div class="collaborators-container">
          <div class="logo-grid">
            <a href="https://www.instagram.com/darkness.bh/" target="_blank" rel="noopener noreferrer" class="logo-item">

            <a href="https://www.instagram.com/oasismallsbahrain/" target="_blank" rel="noopener noreferrer" class="logo-item">

            <a href="https://www.instagram.com/mediacircuit/" target="_blank" rel="noopener noreferrer" class="logo-item">
              <img src="Images/logos/mediacircuit_logo.png" alt="Media Circuit Global" class="collaborator-logo">

            <a href="https://www.instagram.com/newsofbahrain_/" target="_blank" rel="noopener noreferrer" class="logo-item">
              <img src="Images/logos/newsofbahrain.png" alt="NEWS OF BAHRAIN" class="collaborator-logo">

            <a href="https://www.instagram.com/tealflamingostudios/" target="_blank" rel="noopener noreferrer" class="logo-item">
              <img src="Images/logos/TFSLogo.png" alt="Teal Flamingo Studios Logo" class="collaborator-logo">
            </a>
            <a href="https://www.instagram.com/reboot01.coding/" target="_blank" rel="noopener noreferrer" class="logo-item">
              <img src="Images/logos/Reboot-Logo.png" alt="Reboot Coding Institute Logo" class="collaborator-logo">
            </a>
            <a href="https://www.instagram.com/zain.esports/" target="_blank" rel="noopener noreferrer" class="logo-item">
              <img src="Images/logos/ZainEsportsLogo.webp" alt="Zain Esports Logo" class="collaborator-logo">
            </a>
            <a href="https://www.instagram.com/fuddruckersbahrain/" target="_blank" rel="noopener noreferrer" class="logo-item">
              <img src="Images/logos/fudruckers.png" alt="Fudruckers Logo" class="collaborator-logo">
            </a>
            <a href="https://www.instagram.com/hello.dilmune/" target="_blank" rel="noopener noreferrer" class="logo-item">
              <img src="Images/logos/DelmonLogo.webp" alt="dilmune Logo" class="collaborator-logo">
            </a>
            <a href="https://www.instagram.com/dallahpromotions/" target="_blank" rel="noopener noreferrer" class="logo-item">
              <img src="Images/logos/Dallah.png" alt="Gamers Lounge Logo" class="collaborator-logo">

            <a href="https://www.instagram.com/bahraincomiccon/" target="_blank" rel="noopener noreferrer" class="logo-item">

            <a href="https://www.instagram.com/bpesportclub/" target="_blank" rel="noopener noreferrer" class="logo-item">
              <img src="Images/logos/BPEC_LOGO.webp" alt="Gaming Club Logo" class="collaborator-logo">
            </a>

      </div>

  <div id="site-footer"></div><!-- footer injected by components.js -->

  <script src="components.js" defer></script>
  <script src="script.js" defer></script>
